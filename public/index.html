<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Delay Video Call</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Delay Video Call</h1>
    <p class="subtitle">A video call where every second of you takes a while to arrive.</p>
  </header>

  <main>
    <section id="setup" class="panel">
      <label for="room-input">Room code</label>
      <div class="room-row">
        <input id="room-input" type="text" placeholder="e.g. blue-fox-42" autocomplete="off" />
        <button id="join-btn">Join call</button>
      </div>

      <label for="delay-slider" class="delay-label">
        Delay: <span id="delay-value">5</span>s
      </label>
      <input id="delay-slider" type="range" min="0" max="30" step="0.5" value="5" />

      <p id="status" class="status">Enter a room code and share it with the other person, or leave blank to generate one.</p>
      <p id="share-row" class="share-row hidden">
        Share this link: <a id="share-link" href="#"></a>
        <button id="copy-btn" type="button">Copy</button>
      </p>
    </section>

    <section id="call" class="call hidden">
      <div class="video-box">
        <video id="local-video" autoplay playsinline muted></video>
        <span id="local-label" class="label">You (live)</span>
      </div>
      <div class="video-box">
        <video id="remote-video" autoplay playsinline></video>
        <span id="remote-label" class="label">Peer</span>
        <div id="remote-placeholder" class="placeholder">Waiting for peer&hellip;</div>
      </div>
      <div class="controls">
        <button id="mute-btn" class="control-btn" title="Toggle microphone">
          <span class="icon">🎤</span>
          <span class="status">Mute</span>
        </button>
        <button id="camera-btn" class="control-btn" title="Toggle camera">
          <span class="icon">📷</span>
          <span class="status">Camera Off</span>
        </button>
        <div class="volume-control">
          <span class="icon">🔊</span>
          <input id="volume-slider" type="range" min="0" max="1" step="0.1" value="1" title="Volume">
        </div>
        <div class="delay-control">
          <span class="icon">⏱️</span>
          <input id="delay-slider" type="range" min="1" max="10" step="1" value="5" title="Delay seconds">
          <span id="delay-value">5s</span>
        </div>
      </div>
    </section>

    <canvas id="delay-canvas" class="hidden"></canvas>
  </main>

  <script src="app.js"></script>
</body>
</html>
